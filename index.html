<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ani-rss 主题预览</title>
    <meta name="description" content="ani-rss 自定义 CSS 主题的在线预览：真实 Element Plus 样式表 + 1:1 复刻的界面结构、交互与动效"/>

    <!-- 1. Element Plus 组件样式：和 ani-rss 实际用的是同一份（MIT，见 preview/NOTICE.md） -->
    <link rel="stylesheet" href="preview/element-plus.css"/>
    <!-- 2. ani-rss 自己那层样式：热链上游仓库，不落地，自动跟版本（GPL-2.0，见 preview/NOTICE.md） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wushuo894/ani-rss@master/ani-rss-ui/src/style.css"/>
    <!-- 3. 组件布局层 -->
    <link rel="stylesheet" href="preview/app.css"/>

    <style>
        html, body {
            height: 100%;
        }

        body {
            padding-top: 44px;
            box-sizing: border-box;
            overflow: hidden;
        }

        #app {
            height: 100%;
        }

        #app > .content {
            height: 100%;
        }

        .el-scrollbar {
            height: 100%;
        }

        /* ===== 预览页控制栏（不用 el- 前缀，免得被主题染色） ===== */
        .pv-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            z-index: 5000;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 0 14px;
            background: #0d0f13;
            border-bottom: 1px solid #232830;
        }

        .pv-bar, .pv-bar * {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            font-size: 13px;
            color: #e8ecf2;
            letter-spacing: 0;
            text-transform: none;
            font-weight: 400;
        }

        .pv-bar select, .pv-bar button {
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid #333842;
            background: #171a21;
            cursor: pointer;
        }

        .pv-bar button.on {
            border-color: #3f6fa8;
            background: #16283c;
        }

        .pv-bar button:hover:not(:disabled) {
            border-color: #4a5262;
            background: #1e232c;
        }

        .pv-bar button.done {
            border-color: #2f7d54;
            background: #14301f;
            color: #7ee2a8;
        }

        .pv-grow {
            flex: 1;
        }

        .pv-note {
            color: #6f7784 !important;
        }

        @media (max-width: 1240px) {
            .pv-hint {
                display: none;
            }
        }

        /* ===== 弹窗：补上 Vue 侧本来负责的定位 ===== */
        .el-overlay {
            z-index: 2001;
        }

        .el-overlay-dialog {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .el-dialog {
            margin: 0;
            max-height: calc(100vh - 88px);
            display: flex;
            flex-direction: column;
        }

        .el-dialog__body {
            overflow: auto;
            flex: 1;
        }

        .pv-popper {
            position: fixed;
            z-index: 3000;
        }

        .el-collapse-item__wrap {
            overflow: hidden;
            transition: max-height var(--el-transition-duration) ease-in-out;
        }

        /* 竖向标签页（添加订阅 / 修改订阅）内的滚动区 */
        .pv-pane-scroll {
            max-height: 52vh;
            overflow: auto;
            padding-right: 6px;
        }

        /* 设置弹窗里三个重内容的面板：上游是 height:500px + el-scrollbar */
        .pv-tall {
            height: 500px;
            max-height: 52vh;
            overflow: auto;
            padding: 0 12px;
        }

        /* 设置的确定/取消在 body 底部右侧，不是 footer */
        .el-dialog__body > .action {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-top: 8px;
        }

        /* 设置里「其他」四个开关真的作用于列表 */
        .no-score .list-card-score-container,
        .no-time .list-card-time,
        .no-week .list-week-title,
        .no-playlist .list-card-playlist {
            display: none;
        }

        .list-card-url {
            max-width: 300px;
            display: none;
        }

        .no-score .list-card-url {
            display: -webkit-box;
        }

        .pv-logline {
            display: block;
            white-space: pre-wrap;
        }

        .pv-logline i {
            font-style: normal;
            opacity: .55;
        }

        .pv-log-INFO {
            color: #8fbcbb;
        }

        .pv-log-WARN {
            color: #ebcb8b;
        }

        .pv-log-ERROR {
            color: #bf616a;
        }

        .pv-log-DEBUG {
            color: #81a1c1;
        }
    </style>

    <!--
      4. 主题：最后加载，覆盖以上全部。

      用脚本创建 link 而不是写死 <link> 再改 href —— 换主题走 ?t= 参数重载页面，
      保证一次页面生命周期里只存在一张主题表。某些「网页强制深色」类浏览器扩展会把每张
      样式表克隆成内联 <style>，运行时改 href 的话旧主题的克隆会留在文档末尾盖过新主题。
      URL 可以直接分享到具体主题：?t=neon.css
    -->
    <script>
        (function () {
            var t = new URLSearchParams(location.search).get('t')
                || localStorage.getItem('ani-preview-theme') || 'paper.css'
            if (!/^[a-z0-9.-]+\.css$/.test(t)) t = 'paper.css'
            var l = document.createElement('link')
            l.rel = 'stylesheet'
            l.id = 'theme'
            l.href = 'themes/' + t
            document.head.appendChild(l)
            window.__theme = t
        })()
    </script>
</head>
<body>

<div class="pv-bar">
    <label for="pick">主题</label>
    <select id="pick"></select>
    <button id="mode" type="button">切换深色</button>
    <span class="pv-note" id="modeNote"></span>
    <button id="loginToggle" type="button">看登录页</button>
    <span class="pv-note pv-hint">顶部按钮可打开各弹窗</span>
    <span class="pv-grow"></span>
    <span class="pv-note pv-hint">复制到 设置 → 基础设置 → 页面设置 → 自定义 → CSS</span>
    <button id="copyPages" type="button" title="@import GitHub Pages">复制链接 · GitHub</button>
    <button id="copyJsd" type="button" title="@import jsDelivr（国内更快）">复制链接 · jsDelivr</button>
    <button id="copyCss" type="button" title="把整份 CSS 复制走，离线可用">复制 CSS 全文</button>
</div>

<div id="app" style="max-width: 1600px;">

    <!-- ============ 首页 ============ -->
    <div class="content" id="home-view">
        <div id="header">
            <div class="auto-flex" style="margin: 10px;">
                <div>
                    <div class="el-input el-input--prefix" style="min-width: 210px;">
                        <div class="el-input__wrapper">
                            <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="search"></i></span></span>
                            <input class="el-input__inner" id="search" type="text" placeholder="搜索"/>
                        </div>
                    </div>
                </div>
                <div class="spacer"></div>
                <div style="min-width: 300px; display: flex;">
                    <div style="flex: 1;">
                        <div class="el-select" data-select="month">
                            <div class="el-select__wrapper">
                                <div class="el-select__selection">
                                    <div class="el-select__selected-item el-select__placeholder is-transparent"><span data-value>请选择</span></div>
                                </div>
                                <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="spacer"></div>
                    <div style="flex: 1;">
                        <div class="el-select" data-select="enable">
                            <div class="el-select__wrapper">
                                <div class="el-select__selection">
                                    <div class="el-select__selected-item el-select__placeholder"><span data-value>已启用</span></div>
                                </div>
                                <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="add-button" id="toolbar"></div>
        </div>

        <div style="flex: 1; overflow: hidden;">
            <div class="list-container">
                <div class="el-scrollbar hide-scrollbar">
                    <div class="el-scrollbar__wrap">
                        <div class="el-scrollbar__view">
                            <div class="list-content" id="list"></div>
                            <div class="list-bottom-spacer"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ 登录页 ============ -->
    <div class="flex-center content" id="login-view" style="display: none; flex-flow: column; justify-content: space-between;">
        <div id="login-page" class="flex-center">
            <div id="form">
                <div style="text-align: center;">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" style="opacity:.9">
                        <circle cx="6" cy="18" r="2.2" fill="currentColor"/>
                        <path d="M4 11.5a8.5 8.5 0 0 1 8.5 8.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M4 5a15 15 0 0 1 15 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2 class="title-h2">ANI-RSS</h2>
                <form class="el-form el-form--default" onsubmit="return false">
                    <div class="el-form-item">
                        <div class="el-form-item__content">
                            <div class="el-input el-input--prefix full-width">
                                <div class="el-input__wrapper">
                                    <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="user"></i></span></span>
                                    <input class="el-input__inner" type="text" placeholder="用户名" autocomplete="off"/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="el-form-item">
                        <div class="el-form-item__content">
                            <div class="el-input el-input--prefix el-input--suffix full-width">
                                <div class="el-input__wrapper">
                                    <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="key"></i></span></span>
                                    <input class="el-input__inner" type="password" placeholder="密码" autocomplete="off"/>
                                    <span class="el-input__suffix"><span class="el-input__suffix-inner"><i class="el-icon el-input__icon" data-icon="view"></i></span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-center action">
                        <label class="el-checkbox"><span class="el-checkbox__input"><span class="el-checkbox__inner"></span></span><span class="el-checkbox__label">记住密码</span></label>
                        <button type="button" class="el-button is-text is-has-bg" data-act="login"><span><i class="el-icon el-icon--left" data-icon="right"></i> 登录</span></button>
                    </div>
                </form>
            </div>
        </div>
        <div class="footer">
            <a class="el-link el-link--default" href="https://docs.wushuo.top" target="_blank"><span class="el-link__inner">ani-rss</span></a>
            &nbsp;
            <a class="el-link el-link--default" href="https://github.com/wushuo894/ani-rss" target="_blank"><span class="el-link__inner">github</span></a>
        </div>
    </div>

</div>

<div id="dialogs"></div>

<script src="preview/data.js"></script>
<script src="preview/preview.js"></script>

</body>
</html>
