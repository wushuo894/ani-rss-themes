<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ani-rss 主题预览</title>
    <meta name="description" content="ani-rss 自定义 CSS 主题的在线预览：真实 Element Plus 样式表 + 1:1 复刻的界面结构与交互"/>

    <!-- 1. Element Plus 组件样式：和 ani-rss 实际用的是同一份（MIT，见 preview/NOTICE.md） -->
    <link rel="stylesheet" href="preview/element-plus.css"/>
    <!-- 2. ani-rss 自己那层样式：热链上游仓库，不落地，自动跟版本（GPL-2.0，见 preview/NOTICE.md） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wushuo894/ani-rss@master/ani-rss-ui/src/style.css"/>
    <!-- 3. 组件布局层 -->
    <link rel="stylesheet" href="preview/app.css"/>

    <style>
        /* ===== 预览页外壳：顶部那条控制栏，不用 el- 前缀免得被主题染色 ===== */
        html, body {
            height: 100%;
        }

        body {
            padding-top: 44px;
            box-sizing: border-box;
            overflow: hidden;
        }

        #app {
            height: 100%;
        }

        .el-scrollbar {
            height: 100%;
        }

        .pv-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            z-index: 5000;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 0 14px;
            background: #0d0f13;
            border-bottom: 1px solid #232830;
        }

        .pv-bar, .pv-bar * {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            font-size: 13px;
            color: #e8ecf2;
            letter-spacing: 0;
            text-transform: none;
            font-weight: 400;
        }

        .pv-bar select, .pv-bar button {
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid #333842;
            background: #171a21;
            cursor: pointer;
        }

        .pv-bar code {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            color: #7fd4ff;
            background: #171a21;
            padding: 5px 9px;
            border-radius: 5px;
            user-select: all;
            max-width: 40vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pv-grow {
            flex: 1;
        }

        .pv-note {
            color: #6f7784 !important;
        }

        @media (max-width: 900px) {
            .pv-bar code, .pv-hint {
                display: none;
            }
        }

        /* ===== 弹窗：Element Plus 的遮罩是 fixed 的，这里补上 Vue 侧本来负责的定位 ===== */
        .el-overlay {
            z-index: 2001;
        }

        .el-overlay-dialog {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .el-dialog {
            margin: 0;
            max-height: calc(100vh - 88px);
            display: flex;
            flex-direction: column;
        }

        .el-dialog__body {
            overflow: auto;
        }

        /* 下拉菜单/选择器的浮层由脚本定位 */
        .pv-popper {
            position: fixed;
            z-index: 3000;
        }

        /* 折叠面板动画 */
        .el-collapse-item__wrap {
            overflow: hidden;
            transition: max-height var(--el-transition-duration) ease-in-out;
        }

        /* 设置里「其他」四个开关真的作用于列表，和真实应用一致 */
        .no-score .list-card-score-container,
        .no-time .list-card-time,
        .no-week .list-week-title,
        .no-playlist .list-card-playlist {
            display: none;
        }

        .list-card-url {
            max-width: 300px;
            display: none;
        }

        .no-score .list-card-url {
            display: -webkit-box;
        }

        .pv-dl-item {
            margin-bottom: 8px;
        }
    </style>

    <!--
      4. 主题：最后加载，覆盖以上全部。

      用脚本创建 link 而不是写死 <link> 再改 href —— 换主题走 ?t= 参数重载页面，
      保证一次页面生命周期里只存在一张主题表。某些「网页强制深色」类浏览器扩展会把每张
      样式表克隆成内联 <style>，运行时改 href 的话旧主题的克隆会留在文档末尾盖过新主题。
      顺带 URL 可以直接分享到具体主题：?t=neon.css
    -->
    <script>
        (function () {
            var t = new URLSearchParams(location.search).get('t')
                || localStorage.getItem('ani-preview-theme') || 'paper.css'
            if (!/^[a-z0-9.-]+\.css$/.test(t)) t = 'paper.css'
            var l = document.createElement('link')
            l.rel = 'stylesheet'
            l.id = 'theme'
            l.href = 'themes/' + t
            document.head.appendChild(l)
            window.__theme = t
        })()
    </script>
</head>
<body>

<div class="pv-bar">
    <label for="pick">主题</label>
    <select id="pick"></select>
    <button id="mode" type="button">切换深色</button>
    <span class="pv-note" id="modeNote"></span>
    <span class="pv-note pv-hint">点顶部按钮可打开各弹窗</span>
    <span class="pv-grow"></span>
    <span class="pv-note">粘贴到自定义CSS</span>
    <code id="snippet">@import url("...");</code>
</div>

<div id="app" style="max-width: 1600px;">
    <div class="content">

        <div id="header">
            <div class="auto-flex" style="margin: 10px;">
                <div>
                    <div class="el-input el-input--prefix el-input--suffix" style="min-width: 210px;">
                        <div class="el-input__wrapper">
                            <span class="el-input__prefix"><span class="el-input__prefix-inner"><i class="el-icon el-input__icon" data-icon="search"></i></span></span>
                            <input class="el-input__inner" id="search" type="text" placeholder="搜索"/>
                        </div>
                    </div>
                </div>
                <div class="spacer"></div>
                <div style="min-width: 300px; display: flex;">
                    <div style="flex: 1;">
                        <div class="el-select" data-select="month">
                            <div class="el-select__wrapper">
                                <div class="el-select__selection">
                                    <div class="el-select__selected-item el-select__placeholder is-transparent"><span data-value>请选择</span></div>
                                </div>
                                <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="spacer"></div>
                    <div style="flex: 1;">
                        <div class="el-select" data-select="enable">
                            <div class="el-select__wrapper">
                                <div class="el-select__selection">
                                    <div class="el-select__selected-item el-select__placeholder"><span data-value>已启用</span></div>
                                </div>
                                <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="add-button" id="toolbar"></div>
        </div>

        <div style="flex: 1; overflow: hidden;">
            <div class="list-container">
                <div class="el-scrollbar hide-scrollbar">
                    <div class="el-scrollbar__wrap">
                        <div class="el-scrollbar__view">
                            <div class="list-content" id="list"></div>
                            <div class="list-bottom-spacer"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ===================== 弹窗 ===================== -->

<div class="el-overlay" id="dlg-download" style="display:none">
    <div class="el-overlay-dialog">
        <div class="el-dialog is-align-center el-dialog--center" style="width:900px;max-width:calc(100vw - 24px)">
            <header class="el-dialog__header show-close">
                <span role="heading" class="el-dialog__title">下载</span>
                <button type="button" class="el-dialog__headerbtn" data-close><i class="el-icon el-dialog__close" data-icon="close"></i></button>
            </header>
            <div class="el-dialog__body">
                <div class="flex-center" style="margin-bottom: 12px;">
                    <div class="el-radio-group" data-radio="sort">
                        <label class="el-radio-button is-active"><span class="el-radio-button__inner">按名称排序 ↑</span></label>
                        <label class="el-radio-button"><span class="el-radio-button__inner">按进度排序</span></label>
                    </div>
                </div>
                <div id="downloads"></div>
            </div>
        </div>
    </div>
</div>

<div class="el-overlay" id="dlg-manage" style="display:none">
    <div class="el-overlay-dialog">
        <div class="el-dialog is-align-center el-dialog--center" style="width:900px;max-width:calc(100vw - 24px)">
            <header class="el-dialog__header show-close">
                <span role="heading" class="el-dialog__title">管理</span>
                <button type="button" class="el-dialog__headerbtn" data-close><i class="el-icon el-dialog__close" data-icon="close"></i></button>
            </header>
            <div class="el-dialog__body">
                <div class="flex" style="gap:8px;align-items:center;margin-bottom:10px">

                    <span style="flex:1"></span>
                    <button type="button" class="el-button is-text is-has-bg"><span>批量启用</span></button>
                    <button type="button" class="el-button is-text is-has-bg"><span>批量禁用</span></button>
                    <button type="button" class="el-button el-button--danger is-text is-has-bg"><span>批量删除</span></button>
                </div>
                <div id="manageList"></div>
            </div>
        </div>
    </div>
</div>

<div class="el-overlay" id="dlg-logs" style="display:none">
    <div class="el-overlay-dialog">
        <div class="el-dialog is-align-center el-dialog--center logs-dialog" style="width:1000px;max-width:calc(100vw - 24px)">
            <header class="el-dialog__header show-close">
                <span role="heading" class="el-dialog__title">日志</span>
                <button type="button" class="el-dialog__headerbtn" data-close><i class="el-icon el-dialog__close" data-icon="close"></i></button>
            </header>
            <div class="el-dialog__body">
                <div class="header flex" style="align-items:center;gap:8px">
                    <label class="el-checkbox is-checked"><span class="el-checkbox__input is-checked"><span class="el-checkbox__inner"></span></span><span class="el-checkbox__label">自动滚动</span></label>
                    <span style="flex:1"></span>
                    <button type="button" class="el-button is-text is-has-bg"><span>清空</span></button>
                </div>
                <div class="content" id="logs"></div>
            </div>
        </div>
    </div>
</div>

<div class="el-overlay" id="dlg-settings" style="display:none">
    <div class="el-overlay-dialog">
        <div class="el-dialog is-align-center el-dialog--center" style="width:860px;max-width:calc(100vw - 24px)">
            <header class="el-dialog__header show-close">
                <span role="heading" class="el-dialog__title">设置</span>
                <button type="button" class="el-dialog__headerbtn" data-close><i class="el-icon el-dialog__close" data-icon="close"></i></button>
            </header>
            <div class="el-dialog__body">
                <div class="el-tabs el-tabs--top">
                    <div class="el-tabs__header is-top">
                        <div class="el-tabs__nav-wrap is-top">
                            <div class="el-tabs__nav-scroll">

                                    <div class="el-tabs__active-bar is-top" id="activebar"></div>

                                    <div class="el-tabs__item is-top is-active" data-tab="1">基本设置</div>
                                    <div class="el-tabs__item is-top" data-tab="2">全局排除</div>
                                    <div class="el-tabs__item is-top" data-tab="3">代理设置</div>
                                    <div class="el-tabs__item is-top" data-tab="4">登录设置</div>

                                    <div class="el-tabs__item is-top" data-tab="7">关于</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="el-tabs__content">

                        <!-- 下载设置 -->
                        <div class="el-tab-pane" data-pane="0" style="display:none">
                            <form class="el-form el-form--default el-form--label-right full-width">
                                <div class="el-form-item"><label class="el-form-item__label" style="width:110px">下载工具</label><div class="el-form-item__content">
                                    <div class="el-radio-group"><label class="el-radio-button is-active"><span class="el-radio-button__inner">qBittorrent</span></label><label class="el-radio-button"><span class="el-radio-button__inner">Transmission</span></label><label class="el-radio-button"><span class="el-radio-button__inner">Aria2</span></label></div>
                                </div></div>
                                <div class="el-form-item"><label class="el-form-item__label" style="width:110px">下载地址</label><div class="el-form-item__content"><div class="el-input" style="max-width:360px"><div class="el-input__wrapper"><input class="el-input__inner" value="http://qbittorrent:8080"/></div></div></div></div>
                                <div class="el-form-item"><label class="el-form-item__label" style="width:110px">用户名</label><div class="el-form-item__content"><div class="el-input" style="max-width:360px"><div class="el-input__wrapper"><input class="el-input__inner" placeholder="用户名"/></div></div></div></div>
                                <div class="el-form-item"><label class="el-form-item__label" style="width:110px">下载位置</label><div class="el-form-item__content"><div class="el-input" style="max-width:360px"><div class="el-input__wrapper"><input class="el-input__inner" value="/downloads/anime"/></div></div></div></div>
                                <div class="el-form-item"><label class="el-form-item__label" style="width:110px">下载完成后</label><div class="el-form-item__content">
                                    <label class="el-checkbox is-checked"><span class="el-checkbox__input is-checked"><span class="el-checkbox__inner"></span></span><span class="el-checkbox__label">自动删种</span></label>
                                    <label class="el-checkbox"><span class="el-checkbox__input"><span class="el-checkbox__inner"></span></span><span class="el-checkbox__label">删除文件</span></label>
                                </div></div>
                                <div class="el-form-item"><label class="el-form-item__label" style="width:110px">连接测试</label><div class="el-form-item__content">
                                    <button type="button" class="el-button el-button--primary"><span>测试连接</span></button>
                                </div></div>
                            </form>
                        </div>

                        <!-- 基本设置 -->
                        <div class="el-tab-pane" data-pane="1">
                            <div class="el-collapse el-collapse-icon-position-right" id="basicCollapse">

                                <div class="el-collapse-item is-active">
                                    <div class="el-collapse-item__header is-active" role="button">
                                        <span class="el-collapse-item__title">页面设置</span>
                                        <i class="el-icon el-collapse-item__arrow is-active" data-icon="arrow"></i>
                                    </div>
                                    <div class="el-collapse-item__wrap">
                                        <div class="el-collapse-item__content">
                                            <form class="el-form el-form--default el-form--label-right full-width">

                                                <div class="el-form-item"><label class="el-form-item__label" style="width:100px">外观</label>
                                                    <div class="el-form-item__content">
                                                        <div class="el-radio-group" id="appearance">
                                                            <label class="el-radio-button is-active" data-mode="auto"><span class="el-radio-button__inner"><i class="el-icon" data-icon="auto"></i></span></label>
                                                            <label class="el-radio-button" data-mode="light"><span class="el-radio-button__inner"><i class="el-icon" data-icon="gear"></i></span></label>
                                                            <label class="el-radio-button" data-mode="dark"><span class="el-radio-button__inner"><i class="el-icon" data-icon="moon"></i></span></label>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="el-form-item"><label class="el-form-item__label" style="width:100px">主题色</label>
                                                    <div class="el-form-item__content">
                                                        <div class="el-color-picker" style="position:relative">
                                                            <div class="el-color-picker__trigger">
                                                                <span class="el-color-picker__color"><span class="el-color-picker__color-inner" id="swatch" style="background-color: var(--el-color-primary)"><i class="el-icon el-color-picker__icon" data-icon="caret"></i></span></span>
                                                            </div>
                                                            <input type="color" id="accent" value="#409eff" style="position:absolute;inset:0;opacity:0;cursor:pointer"/>
                                                        </div>
                                                        <span class="el-text el-text--info el-text--small" style="margin-left:10px" id="accentNote"></span>
                                                    </div>
                                                </div>

                                                <div class="el-form-item"><label class="el-form-item__label" style="width:100px">排序</label>
                                                    <div class="el-form-item__content">
                                                        <div class="el-select" data-select="order" style="width:150px">
                                                            <div class="el-select__wrapper"><div class="el-select__selection"><div class="el-select__selected-item el-select__placeholder"><span data-value>评分</span></div></div><div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div></div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="el-form-item"><label class="el-form-item__label" style="width:100px">最大内容宽度</label>
                                                    <div class="el-form-item__content">
                                                        <div class="el-input-number" style="width:150px">
                                                            <span role="button" class="el-input-number__decrease" id="widthDec"><i class="el-icon" data-icon="minus"></i></span>
                                                            <span role="button" class="el-input-number__increase" id="widthInc"><i class="el-icon" data-icon="plus"></i></span>
                                                            <div class="el-input"><div class="el-input__wrapper"><input class="el-input__inner" id="widthVal" value="1600"/></div></div>
                                                        </div>
                                                        <span class="el-text el-text--small" style="margin-left:8px">px</span>
                                                    </div>
                                                </div>

                                                <div class="el-form-item"><label class="el-form-item__label" style="width:100px">其他</label>
                                                    <div class="el-form-item__content" id="toggles">
                                                        <label class="el-checkbox is-checked" data-toggle="no-score"><span class="el-checkbox__input is-checked"><span class="el-checkbox__inner"></span></span><span class="el-checkbox__label">显示评分</span></label>

                                                        <label class="el-checkbox is-checked" data-toggle="no-playlist"><span class="el-checkbox__input is-checked"><span class="el-checkbox__inner"></span></span><span class="el-checkbox__label">显示视频列表</span></label>

                                                    </div>
                                                </div>

                                                <div class="el-form-item"><label class="el-form-item__label" style="width:100px">自定义</label>
                                                    <div class="el-form-item__content">
                                                        <button type="button" class="el-button"><span><i class="el-icon el-icon--left" data-icon="tickets"></i> JavaScript</span></button>
                                                        <button type="button" class="el-button"><span><i class="el-icon el-icon--left" data-icon="files"></i> CSS</span></button>
                                                    </div>
                                                </div>

                                            </form>
                                        </div>
                                    </div>
                                </div>

                                <div class="el-collapse-item">
                                    <div class="el-collapse-item__header" role="button"><span class="el-collapse-item__title">添加订阅</span><i class="el-icon el-collapse-item__arrow" data-icon="arrow"></i></div>

                                        <form class="el-form el-form--label-right full-width">

                                    <div class="el-collapse-item__wrap" style="max-height:0"><div class="el-collapse-item__content">
                                        <form class="el-form el-form--label-right full-width">
                                            <div class="el-form-item"><label class="el-form-item__label" style="width:100px">重命名模板</label><div class="el-form-item__content"><div class="el-input" style="max-width:420px"><div class="el-input__wrapper"><input class="el-input__inner" value="${title} S${season}E${episode}"/></div></div></div></div>
                                            <div class="el-form-item"><label class="el-form-item__label" style="width:100px">硬链接</label><div class="el-form-item__content"><div class="el-switch is-checked"><span class="el-switch__core"><div class="el-switch__action"></div></span></div></div></div>
                                            <div class="el-form-item"><label class="el-form-item__label" style="width:100px">季度目录</label><div class="el-form-item__content"><div class="el-switch is-checked"><span class="el-switch__core"><div class="el-switch__action"></div></span></div></div></div>
                                        </form>
                                        <div class="el-alert el-alert--warning is-light" style="margin-top:8px"><div class="el-alert__content"><span class="el-alert__title">模板变更后，已入库的剧集不会自动重命名</span></div></div>
                                    </div></div>
                                </div>

                                <div class="el-collapse-item">
                                    <div class="el-collapse-item__header" role="button"><span class="el-collapse-item__title">刮削设置</span><i class="el-icon el-collapse-item__arrow" data-icon="arrow"></i></div>
