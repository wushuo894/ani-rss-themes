<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ani-rss 主题预览</title>
    <meta name="description" content="ani-rss 自定义 CSS 主题的在线预览，用真实的 Element Plus 样式表与真实 DOM 结构渲染"/>

    <!-- 1. Element Plus 组件样式：和 ani-rss 实际用的是同一份（MIT，见 preview/NOTICE.md） -->
    <link rel="stylesheet" href="preview/element-plus.css"/>
    <!-- 2. ani-rss 自己那层样式：热链上游仓库，不落地，自动跟版本（GPL-2.0，见 preview/NOTICE.md） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wushuo894/ani-rss@master/ani-rss-ui/src/style.css"/>
    <!-- 3. 组件布局层 -->
    <link rel="stylesheet" href="preview/app.css"/>

    <style>
        /* 预览页专用：把真实应用的「整屏 + 内部滚动」改成整页滚动，方便一路看下去 */
        html, body {
            height: auto;
            min-height: 100%;
        }

        #app {
            height: auto;
        }

        .list-container {
            height: auto;
            overflow: visible;
        }

        .pv-section .el-overlay-dialog {
            position: static;
            padding: 0;
        }

        .pv-dialog {
            width: 880px;
            max-width: 100%;
            margin: 0 auto;
        }

        #login-page {
            min-height: 340px;
        }

        /* 预览页自己的控制条，不用 el- 前缀，免得被主题染色 */
        .pv-bar {
            position: sticky;
            top: 0;
            z-index: 3000;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 10px 16px;
            background: #0d0f13;
            border-bottom: 1px solid #232830;
        }

        .pv-bar, .pv-bar * {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            font-size: 13px;
            color: #e8ecf2;
            letter-spacing: 0;
            text-transform: none;
        }

        .pv-bar select,
        .pv-bar button {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #333842;
            background: #171a21;
            cursor: pointer;
        }

        .pv-bar code {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 12px;
            color: #7fd4ff;
            background: #171a21;
            padding: 5px 9px;
            border-radius: 5px;
            user-select: all;
            max-width: 44vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pv-grow {
            flex: 1;
        }

        .pv-note {
            color: #6f7784 !important;
        }

        .pv-section {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .pv-caption {
            margin: 46px 0 10px;
            padding-left: 4px;
            font-size: 12px;
            letter-spacing: .16em;
            color: var(--el-text-color-secondary);
        }

        .pv-mock {
            font-size: 11px;
            color: var(--el-text-color-placeholder);
            padding: 0 0 40px 4px;
        }

        @media (max-width: 820px) {
            .pv-bar code {
                display: none;
            }
        }
    </style>

    <!--
      4. 主题：最后加载，覆盖以上全部。

      这里用脚本创建 link 而不是写死一个 <link> 再改 href —— 换主题走 ?t= 参数重载页面，
      保证一次页面生命周期里只存在一张主题表。某些「网页强制深色」类浏览器扩展会把每张
      样式表克隆成内联 <style>，运行时改 href 的话旧主题的克隆会留在文档末尾并盖过新主题。
      顺带 URL 可以直接分享到具体主题：index.html?t=neon.css
    -->
    <script>
        (function () {
            var t = new URLSearchParams(location.search).get('t')
                || localStorage.getItem('ani-preview-theme')
                || 'paper.css'
            if (!/^[a-z0-9.-]+\.css$/.test(t)) t = 'paper.css'
            var l = document.createElement('link')
            l.rel = 'stylesheet'
            l.id = 'theme'
            l.href = 'themes/' + t
            document.head.appendChild(l)
            window.__theme = t
        })()
    </script>
</head>
<body>

<div class="pv-bar">
    <label for="pick">主题</label>
    <select id="pick"></select>
    <button id="mode" type="button">切换深色</button>
    <label class="pv-note" for="cols">列数</label>
    <select id="cols">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option selected>4</option>
    </select>
    <span class="pv-note" id="modeNote"></span>
    <span class="pv-grow"></span>
    <span class="pv-note">粘贴到自定义CSS</span>
    <code id="snippet">@import url("...");</code>
</div>

                                </div>
                                <div class="el-select__suffix"><i class="el-icon el-select__caret el-select__icon" data-icon="caret2"></i></div>
                            </div>
                        </div>
                    </div>

                            <div class="el-select__wrapper">

                            </div>
                        </div>

                </div>

            <div class="add-button" id="toolbar"></div>
        </div>

        <div style="flex: 1; overflow: hidden;">

                <div class="el-scrollbar hide-scrollbar">
                    <div class="el-scrollbar__wrap">
                        <div class="el-scrollbar__view">
                            <div class="list-content" id="list"></div>
                            <div class="list-bottom-spacer"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

        '<div class="list-card-info"><div class="list-card-info-inner">' +
        '<div class="flex"><span class="el-text is-truncated is-line-clamp list-card-title" style="-webkit-line-clamp:1" title="' + esc(a.t) + '">' + esc(a.t) + '</span></div>' +

        '<div class="list-card-tags gtc3">' +
        tag('primary', ' 第 ' + a.s + ' 季 ') +
        (a.on ? tag('success', ' 已启用 ') : tag('info', ' 未启用 ')) +

        tag('warning', a.ep) +
        tag('danger', a.ova ? ' ova ' : ' tv ') +
        (a.sb ? tag('primary', ' 备用RSS ') : '') +
        '</div>' +
        '<span class="el-text el-text--info el-text--small">' + a.ago + '</span>' +
        '</div>' +

        '<button type="button" class="el-button is-text is-has-bg"><span class=""><i class="el-icon">' + ICON.files + '</i></span></button>' +

        '</div></div></div></div></div></div>'

    document.getElementById('list').innerHTML =

    /* 静态标记里的图标：统一用 data-icon 填充 */
    document.querySelectorAll('[data-icon]').forEach(el => {
        const svg = ICON[el.dataset.icon]

    })

    /* 下载弹窗：进度卡片列表 */
    const DOWNLOADS = [
        {n: '[桜都字幕组] 葬送的芙莉莲 第二季 (2026) [tmdbid=209867] S02E07 [1080p]', p: 100, tags: ['ani-rss', 'MOVIEPILOT', 'RENAME', '下载完成', '备用RSS', '已整理', '桜都字幕组'], size: '512.40 MiB', st: 'uploading'},

        ['acg-cyber.css', '二次元 · 电子霓虹', 'dark'],

    ]

    const cols = document.getElementById('cols')

    THEMES.forEach(([file, name]) => {

    })

    const current = THEMES.some(t => t[0] === window.__theme) ? window.__theme : 'paper.css'
    const meta = THEMES.find(t => t[0] === current)
    const base = location.href.replace(/index\.html.*$/, '').replace(/[?#].*$/, '')

    pick.value = current
    snippet.textContent = '@import url("' + base + 'themes/' + current + '");'
    localStorage.setItem('ani-preview-theme', current)

    function setMode(dark, silent) {
        document.documentElement.classList.toggle('dark', dark)
        modeBtn.textContent = dark ? '切换浅色' : '切换深色'
        if (!silent) localStorage.setItem('ani-preview-dark', dark ? '1' : '0')
    }

    // 强制单向的主题锁定明暗开关
    const fixed = meta[2] !== 'auto'
    modeBtn.disabled = fixed
    modeBtn.style.opacity = fixed ? '.4' : '1'
    modeNote.textContent = fixed ? (meta[2] === 'dark' ? '该主题强制深色' : '该主题强制浅色') : ''
    setMode(fixed ? meta[2] === 'dark' : localStorage.getItem('ani-preview-dark') === '1', true)

    // 换主题 = 带 ?t= 重载，见 <head> 里的说明
    pick.addEventListener('change', () => {
        localStorage.setItem('ani-preview-theme', pick.value)
        location.search = '?t=' + pick.value
    })
    modeBtn.addEventListener('click', () => setMode(!document.documentElement.classList.contains('dark')))
    cols.addEventListener('change', () => {
        document.documentElement.style.setProperty('--ani-grid-columns', cols.value)

    })
