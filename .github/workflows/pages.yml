name: Pages

# 预览站 = 旧主题预览（legacy/）+ 五款 WebUI 的演示构建。
#
# 之所以改成用 Actions 发布而不是「从分支根目录发布」：仓库已经拆成 legacy/ 和 webui/
# 两个目录，但线上必须保留 /themes/xxx.css 这个地址 —— 用户 @import 的就是它，
# 换了地址等于把所有已经装好的人的主题弄没。这里把 legacy/ 的内容铺回站点根，
# 老地址原样可用，新东西挂在 /webui/ 下面。
on:
  push:
    branches: [main]
    paths: ['legacy/**', 'webui/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个发布，后来的等前面的做完（不取消：取消会留下半个站点）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - run: npm ci
        working-directory: webui

      - name: 构建五款演示版
        # VITE_DEMO=1：拦掉所有请求用内置假数据顶上，预览站没有后端
        run: npm run build:all -- --demo
        working-directory: webui

      - name: 组装站点
        run: |
          set -e
          mkdir -p site
          # 旧站原样铺回根目录：/themes/*.css 这些地址一个字都不能变
          cp -r legacy/. site/
          mkdir -p site/webui
          cp webui/preview-index.html site/webui/index.html
          for id in acg liquid-glass vue github material; do
            test -f "webui/dist/$id/index.html" || { echo "::error::webui/dist/$id 没构建出来"; exit 1; }
            cp -r "webui/dist/$id" "site/webui/$id"
          done
          # 老地址活着才算数，缺一个就当失败
          for f in index.html themes/github.css preview/preview.js webui/index.html webui/vue/index.html; do
            test -f "site/$f" || { echo "::error::站点缺少 $f"; exit 1; }
          done
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
