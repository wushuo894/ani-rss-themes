name: WebUI

# 每次改动 WebUI 都构建一遍（早发现比早发布重要）；
# 打 webui-v* 标签时额外产出可直接解压使用的压缩包并建 Release。
on:
  push:
    # 这里刻意不加 paths 过滤：GitHub 对 tag 推送同样会套用 paths，
    # 一旦打的 tag 指向的提交没碰 webui 文件，发版就会静默地不触发。
    # 构建只要两分钟，宁可多跑几次，也不要发版时莫名其妙没反应。
    branches: [main]
    tags: ['webui-v*']
  pull_request:
    paths: ['webui-vt/**', 'webui-qb/**', 'webui-shared/**']
  workflow_dispatch:

# 同一分支的新推送取消上一次未跑完的（构建 webplayer 要几分钟，不值得排队）
concurrency:
  group: webui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # 建 Release 需要

jobs:
  # ─────────────────────────────────────────────────────────
  build:
    name: 构建两套 WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui-vt/package-lock.json
            webui-qb/package-lock.json

      # webui-shared 的运行时依赖（js-md5）装在仓库根：
      # 它被两个 app 用路径别名引入，不在任何一个 app 的 node_modules 里
      - name: 装根依赖
        run: npm ci

      - name: 装 webui-vt 依赖
        run: npm ci --prefix webui-vt

      - name: 装 webui-qb 依赖
        run: npm ci --prefix webui-qb

      # 主题的 scope() 有括号配对和 @media 递归，写错不会报错只会生成坏 CSS
      - name: 主题自检
        run: npm run test:themes

      # build 脚本里已经串了 vue-tsc，类型错误会让构建直接失败
      - name: 构建 webui-vt
        run: npm run build --prefix webui-vt

      - name: 构建 webui-qb
        run: npm run build --prefix webui-qb

      - name: 校验产物
        run: |
          set -e
          for app in vt qb; do
            d="webui-$app/dist"
            test -f "$d/index.html" || { echo "::error::$d 缺少 index.html"; exit 1; }
            test -d "$d/assets"     || { echo "::error::$d 缺少 assets/"; exit 1; }
            # base 必须是相对路径，否则挂子路径反代下资源全 404
            grep -q 'src="\./assets/' "$d/index.html" \
              || { echo "::error::$d/index.html 的资源不是相对路径，检查 vite 的 base"; exit 1; }
            echo "$app: $(du -sh "$d" | cut -f1)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: webui-vt
          path: webui-vt/dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: webui-qb
          path: webui-qb/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # webplayer 是另一个仓库，没有 Release 可取，只能从源码构建。
  # 只有要发版时才跑 —— 它有 30MB 的 wasm 要装，日常 CI 没必要等。
  player:
    name: 构建 webplayer
    if: startsWith(github.ref, 'refs/tags/webui-v')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zzzwannasleep/webplayer
          path: webplayer

      - id: rev
        run: echo "sha=$(git -C webplayer rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webplayer/package-lock.json

      - run: npm ci
        working-directory: webplayer

      - run: npm run build
        working-directory: webplayer

      # 压缩包里要带一层 player/，这样和 WebUI 的包解压到同一个 webui/ 目录即可各就各位
      - name: 套一层 player/
        run: |
          set -e
          test -f webplayer/dist/play.html || { echo "::error::webplayer 产物里没有 play.html"; exit 1; }
          mkdir -p staging
          cp -r webplayer/dist staging/player
          du -sh staging/player

      - uses: actions/upload-artifact@v4
        with:
          name: webplayer
          path: staging
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  release:
    name: 打包并发布
    if: startsWith(github.ref, 'refs/tags/webui-v')
    needs: [build, player]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      # 资产名不带版本号：install 脚本用 releases/latest/download/<固定名> 取，
      # 这个地址不需要调 API，也就没有速率限制的问题
      - name: 打压缩包
        run: |
          set -e
          mkdir -p out
          (cd art/webui-vt   && zip -qr ../../out/ani-rss-webui-vt.zip .)
          (cd art/webui-qb   && zip -qr ../../out/ani-rss-webui-qb.zip .)
          (cd art/webplayer  && zip -qr ../../out/ani-rss-webplayer.zip .)
          cd out && sha256sum *.zip > checksums.txt && ls -lh

      - name: 生成发布说明
        run: |
          cat > notes.md <<EOF
          解压到 ani-rss 配置目录下的 \`webui/\` 即可（没有就新建一个）。

          | 压缩包 | 内容 | 解压到 |
          |---|---|---|
          | \`ani-rss-webui-vt.zip\`   | VueTorrent 风：总览页 + 海报网格 | \`webui/\` |
          | \`ani-rss-webui-qb.zip\`   | qb-web 风：紧凑表格，打开就干活 | \`webui/\` |
          | \`ani-rss-webplayer.zip\`  | 在线播放器（可选，含一层 \`player/\`）| \`webui/\` |

          两套界面**选一套**装。想要在线播放就把 webplayer 那个包也解压到同一个 \`webui/\` 下。

          ### 一行装好

          Linux / macOS / NAS：
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`

          Windows PowerShell：
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
          \`\`\`

          脚本会问你 webui 目录在哪、装哪一套、要不要播放器，然后自己下载解压。

          ### 播放前先跑一下

          webplayer 靠按字节范围精确取流拆容器，服务端差一个字节就放不了，
          而且崩在解复用阶段、看着像播放器的锅。先判定责任：

          \`\`\`bash
          node webui-shared/tools/range-probe.mjs "http://<ani-rss>/api/file?filename=<base64>&s=<token>"
          \`\`\`

          ---
          webplayer 构建自 \`zzzwannasleep/webplayer@${{ needs.player.outputs.sha }}\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/ani-rss-webui-vt.zip
            out/ani-rss-webui-qb.zip
            out/ani-rss-webplayer.zip
            out/checksums.txt
          body_path: notes.md
