name: WebUI

# 每次改动 WebUI 都构建一遍（早发现比早发布重要）；
# 打 webui-v* 标签时额外产出可直接解压使用的压缩包并建 Release。
on:
  push:
    # 这里刻意不加 paths 过滤：GitHub 对 tag 推送同样会套用 paths，
    # 一旦打的 tag 指向的提交没碰 webui 文件，发版就会静默地不触发。
    # 构建只要两分钟，宁可多跑几次，也不要发版时莫名其妙没反应。
    branches: [main]
    tags: ['webui-v*']
  pull_request:
    paths: ['webui/**']
  workflow_dispatch:

# 同一分支的新推送取消上一次未跑完的（构建 webplayer 要几分钟，不值得排队）
concurrency:
  group: webui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # 建 Release 需要

jobs:
  # ─────────────────────────────────────────────────────────
  build:
    name: 构建五款界面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - run: npm ci
        working-directory: webui

      # 主题的 scope() 有括号配对和 @media 递归，写错不会报错只会生成坏 CSS
      - name: 主题自检
        run: npm run test:themes
        working-directory: webui

      # build:all 里已经串了 vue-tsc，类型错误会让构建直接失败
      - name: 构建五款
        run: npm run build:all
        working-directory: webui

      - name: 校验产物
        run: |
          set -e
          for id in acg liquid-glass vue github material; do
            d="webui/dist/$id"
            test -f "$d/index.html" || { echo "::error::$d 缺少 index.html"; exit 1; }
            test -d "$d/assets"     || { echo "::error::$d 缺少 assets/"; exit 1; }
            # base 必须是相对路径，否则挂子路径反代下资源全 404
            grep -q 'src="\./assets/' "$d/index.html" \
              || { echo "::error::$d/index.html 的资源不是相对路径，检查 vite 的 base"; exit 1; }
            # 演示数据只该出现在 Pages 的预览构建里，混进正式产物等于发了个假后端
            if grep -rq '喵萌奶茶屋' "$d/assets"; then
              echo "::error::$d 里混进了演示数据，检查 VITE_DEMO"; exit 1
            fi
            echo "$id: $(du -sh "$d" | cut -f1)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: webui
          path: webui/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # webplayer 是另一个仓库，没有 Release 可取，只能从源码构建。
  # 只有要发版时才跑 —— 它有 30MB 的 wasm 要装，日常 CI 没必要等。
  player:
    name: 构建 webplayer
    if: startsWith(github.ref, 'refs/tags/webui-v')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zzzwannasleep/webplayer
          path: webplayer

      - id: rev
        run: echo "sha=$(git -C webplayer rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webplayer/package-lock.json

      - run: npm ci
        working-directory: webplayer

      - run: npm run build
        working-directory: webplayer

      # 压缩包里要带一层 player/，解压到 webui/ 就各就各位
      - name: 套一层 player/
        run: |
          set -e
          test -f webplayer/dist/play.html || { echo "::error::webplayer 产物里没有 play.html"; exit 1; }
          mkdir -p staging
          cp -r webplayer/dist staging/player
          du -sh staging/player

      - uses: actions/upload-artifact@v4
        with:
          name: webplayer
          path: staging
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  release:
    name: 打包并发布
    if: startsWith(github.ref, 'refs/tags/webui-v')
    needs: [build, player]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      # 每个包都自带播放器：在线播放本来就是 ani-rss 的功能，我们只是把它自带的
      # 播放器换成支持 ASS 特效字幕和 HDR 的那个，拆成两个包只会让人少装一个然后以为坏了。
      # 资产名不带版本号：install 脚本用 releases/latest/download/<固定名> 取，
      # 这个地址不需要调 API，也就没有速率限制的问题。
      - name: 打压缩包
        run: |
          set -e
          mkdir -p out
          for id in acg liquid-glass vue github material; do
            stage="stage/$id"
            mkdir -p "$stage"
            cp -r "art/webui/$id/." "$stage/"
            cp -r art/webplayer/player "$stage/player"
            test -f "$stage/player/play.html" || { echo "::error::$id 包里没有 player/play.html"; exit 1; }
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/out/ani-rss-webui-$id.zip" .)
          done
          cd out && sha256sum *.zip > checksums.txt && ls -lh

      - name: 生成发布说明
        run: |
          cat > notes.md <<EOF
          五款界面挑一款，解压到 ani-rss 配置目录下的 \`webui/\` 即可（没有就新建一个）。
          **每个包都自带在线播放器**，不用再单独下一个。

          | 压缩包 | 长什么样 |
          |---|---|
          | \`ani-rss-webui-acg.zip\`          | 二次元：壁纸打底的海报墙，窄屏走底部导航 |
          | \`ani-rss-webui-liquid-glass.zip\` | 液态玻璃：悬浮玻璃胶囊导航 + 横躺大卡 |
          | \`ani-rss-webui-vue.zip\`          | Vue 文档：分组侧栏 + 居中正文 |
          | \`ani-rss-webui-github.zip\`       | GitHub：深色顶栏 + tab，一张带边框的清单 |
          | \`ani-rss-webui-material.zip\`     | Material Design 3：导航栏杆 / 底部导航 + FAB |

          五款是同一套功能的不同外观，**装一款就够**，装第二款会覆盖第一款。

          ### 一行装好

          Linux / macOS / NAS：
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`

          Windows PowerShell：
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
          \`\`\`

          脚本会问你 webui 目录在哪、装哪一款，然后自己下载解压。

          ### 先在线看看

          <https://zzzwannasleep.github.io/ani-rss-themes/webui/> —— 五款都能点开试，数据是内置的假数据。

          ### 播放前先跑一下

          webplayer 靠按字节范围精确取流拆容器，服务端差一个字节就放不了，
          而且崩在解复用阶段、看着像播放器的锅。先判定责任：

          \`\`\`bash
          node webui/shared/tools/range-probe.mjs "http://<ani-rss>/api/file?filename=<base64>&s=<token>"
          \`\`\`

          ---
          webplayer 构建自 \`zzzwannasleep/webplayer@${{ needs.player.outputs.sha }}\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/checksums.txt
          body_path: notes.md
