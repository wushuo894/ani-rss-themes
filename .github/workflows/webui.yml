name: WebUI

# 改了 WebUI 就构建、打包、发版，一条龙。
#
# 以前发版卡在「手动打一个 webui-v* 标签」上 —— 结果一个标签都没打过，
# 仓库里一个 Release 都没有，install.sh 取的 releases/latest/download/ 一直是 404。
# 需要人记得做的步骤等于不会做，改成推上 main 就自动发。
on:
  push:
    branches: [main]
    paths: ['webui/**', '.github/workflows/webui.yml']
  pull_request:
    paths: ['webui/**']
  workflow_dispatch:

# PR 上新推送取消旧的；main 上不取消 —— 发布那步是先删旧 Release 再传新包，
# 卡在中间被砍会留下一个「Release 没了、新包也没传」的空窗，install.sh 直接 404。
concurrency:
  group: webui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write        # 建 Release 需要

jobs:
  # ─────────────────────────────────────────────────────────
  build:
    name: 构建九款界面
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.meta.outputs.presets }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # 款式清单只认 ids.ts 一处：以前构建、校验、打包三处各抄了一遍同样的五个 id，
      # 加第六款要记得改三个地方，漏掉打包那处就是「构建出来了但没进压缩包」。
      - id: meta
        run: |
          set -e
          ids=$(node --experimental-strip-types -e "import('./webui/src/presets/ids.ts').then(m => console.log(m.PRESET_IDS.join(' ')))")
          test -n "$ids" || { echo "::error::没能从 ids.ts 读出款式清单"; exit 1; }
          echo "presets=$ids" >> "$GITHUB_OUTPUT"
          #
          # ── 版本号 ──
          #
          # ani-rss 的在线更新是这么判的：读装好的那份 webui.json 里的 version，
          # 跟本仓库 Release 的 tag 比字符串，不一样才提示更新。
          #
          # 原来这个数直接取 webui/package.json，而那是个要人手改的常量 ——
          # 于是每次推 main 都发同一个 1.0.2，tag 删了又建，version 一动不动。
          # 装过一次的人此后**永远**收不到更新提示：两个数永远相等。
          # 「需要人记得做的步骤等于不会做」，上面发版那段已经栽过一次，这儿是第二次。
          #
          # 改成补丁位跟着 run_number 走：它由 GitHub 维护、只增不减，
          # 每一次发版必定是一个没出现过的、比上一次大的版本号。
          # 大小版本还是留给人：想发 1.1 就把 package.json 改成 1.1.0，
          # 补丁位它自己接着涨。
          base=$(node -p "require('./webui/package.json').version")
          echo "$base" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::package.json 里的 $base 不是 1.0.0 这样的三段数字"; exit 1; }
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="${base%.*}.${GITHUB_RUN_NUMBER}"
          else
            version="$base"        # PR 上不发版，原样用，免得看着像要发版
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "款式：$ids"
          echo "版本：$version（package.json 是 $base）"

      - run: npm ci
        working-directory: webui

      # 两类「不会报错、只会悄悄坏掉」的东西：
      #  - 主题的 scope() 有括号配对和 @media 递归，写错只会生成坏 CSS
      #  - 接口 URL 拼接，问号被转义进路径的话按钮照点、请求照发，就是参数到不了后端
      - name: 自检
        run: npm test
        working-directory: webui

      # 关于页显示的界面版本号是构建期从 package.json 注进去的（见 vite.config.ts 的
      # __VERSION__）。上面把发版用的版本号算出来了，这里得写回 package.json，
      # 否则包里的 webui.json 写着 1.0.37、关于页却还挂着 1.0.2 —— 两个数对不上，
      # 人根本没法判断自己装的是哪一版。
      # 放在 npm ci 之后：npm ci 会核对 package.json 和 lock 里的版本，先改会让它罢工。
      - name: 版本号写回 package.json
        run: |
          set -e
          node -e "
            const fs = require('fs')
            const p = './webui/package.json'
            const j = JSON.parse(fs.readFileSync(p, 'utf8'))
            j.version = process.argv[1]
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n')
          " "${{ steps.meta.outputs.version }}"
          test "$(node -p "require('./webui/package.json').version")" = "${{ steps.meta.outputs.version }}" \
            || { echo "::error::版本号没写进去"; exit 1; }

      # 不用浏览器的那几条单测。跑得起来的原因是它们只依赖 node ——
      # 四个版式/行为体检要真产物 + 无头浏览器，那些留在本地跑。
      # 这里非跑不可的是 markdown.test.ts：更新说明是 GitHub Release 里别人写的正文，
      # 直接进 v-html，转义一旦被改坏就是任何能改那个仓库 Release 的人都能执行脚本。
      # 这种事不该等到有人手动跑测试才发现。
      - name: 单测
        run: npm test
        working-directory: webui

      # build:all 里已经串了 vue-tsc，类型错误会让构建直接失败
      - name: 构建九款
        run: npm run build:all
        working-directory: webui

      - name: 校验产物
        run: |
          set -e
          for id in ${{ steps.meta.outputs.presets }}; do
            d="webui/dist/$id"
            # ani-rss 是启动时扫 config/webui/index.html 才认这套前端的，缺它整个包等于没装
            test -f "$d/index.html" || { echo "::error::$d 缺少 index.html"; exit 1; }
            test -d "$d/assets"     || { echo "::error::$d 缺少 assets/"; exit 1; }
            # base 必须是相对路径，否则挂子路径反代下资源全 404
            grep -q 'src="\./assets/' "$d/index.html" \
              || { echo "::error::$d/index.html 的资源不是相对路径，检查 vite 的 base"; exit 1; }
            # 演示数据只该出现在 Pages 的预览构建里，混进正式产物等于发了个假后端
            if grep -rq '喵萌奶茶屋' "$d/assets"; then
              echo "::error::$d 里混进了演示数据，检查 VITE_DEMO"; exit 1
            fi
            # 关于页那个版本号是构建期注进去的字符串常量，注错了只会显示成旧版，
            # 没有任何报错。在产物里找一遍，找不到就当构建失败 ——
            # 「版本号不会跟着涨」这件事已经让在线更新彻底失灵过一次。
            grep -rq "${{ steps.meta.outputs.version }}" "$d/assets" \
              || { echo "::error::$d 里找不到版本号 ${{ steps.meta.outputs.version }}，__VERSION__ 没注进去"; exit 1; }
            echo "$id: $(du -sh "$d" | cut -f1)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: webui
          path: webui/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # webplayer 是另一个仓库，没有 Release 可取，只能从源码构建。
  # 它要装 30MB 的 wasm、跑好几分钟，而它自己一个月也不见得动一次 ——
  # 拿上游 HEAD 的 sha 当 key 把整个产物缓存起来，sha 没变就直接命中，几秒钟的事。
  # （以前它只在打标签时才跑，现在每次推 main 都要发版，不缓存就是每次白等五分钟。）
  player:
    name: 构建 webplayer
    if: github.ref == 'refs/heads/main'      # 产物只有发版用得上，PR 上不必跑
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      # ls-remote 不用克隆就能拿到 sha，缓存命中时那个仓库一个字节都不用下
      - id: rev
        run: |
          set -e
          sha=$(git ls-remote https://github.com/zzzwannasleep/webplayer HEAD | cut -c1-7)
          test -n "$sha" || { echo "::error::读不到 webplayer 的 HEAD"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@v4
        with:
          path: staging
          key: webplayer-${{ steps.rev.outputs.sha }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: zzzwannasleep/webplayer
          path: webplayer

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webplayer/package-lock.json

      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: webplayer

      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build
        working-directory: webplayer

      # 压缩包里要带一层 player/，解压到 webui/ 就各就各位
      - if: steps.cache.outputs.cache-hit != 'true'
        name: 套一层 player/
        run: |
          set -e
          test -f webplayer/dist/play.html || { echo "::error::webplayer 产物里没有 play.html"; exit 1; }
          mkdir -p staging
          cp -r webplayer/dist staging/player

      # 命中缓存的那次也验一遍：坏掉的缓存比没有缓存更难查
      - name: 校验 player/
        run: |
          test -f staging/player/play.html \
            || { echo "::error::staging/player 里没有 play.html（缓存坏了？换个 key 重跑）"; exit 1; }
          du -sh staging/player

      - uses: actions/upload-artifact@v4
        with:
          name: webplayer
          path: staging
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  release:
    name: 打包并发布
    if: github.ref == 'refs/heads/main'
    needs: [build, player]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # tag 就是版本号本身（1.0.0，不带 webui-v 前缀）：ani-rss 的在线更新拿包里
      # webui.json 的 version 跟 tag 比，前缀会让它永远认为「有新版」并反复重装。
      TAG: ${{ needs.build.outputs.version }}
    steps:
      # 要发的包全在 artifact 里，但发布说明得数提交，所以还是要一份带全部历史的仓库。
      # fetch-depth: 0 —— 默认只拉一个 commit，那样既没有 tag 也没有历史，
      # 「自上一版以来改了什么」直接无从算起。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: art

      # 九款各打各的包 —— 一款一个 zip，装谁下谁，不必为一款界面下九份。
      # 但播放器不单独拆包：在线播放本来就是 ani-rss 的功能，我们只是把它自带的
      # 播放器换成支持 ASS 特效字幕和 HDR 的那个，拆开只会让人少装一个然后以为坏了。
      # 资产名不带版本号：install 脚本用 releases/latest/download/<固定名> 取，
      # 这个地址不需要调 API，也就没有速率限制的问题。
      - name: 打压缩包
        run: |
          set -e
          mkdir -p out
          for id in ${{ needs.build.outputs.presets }}; do
            stage="stage/$id"
            mkdir -p "$stage"
            cp -r "art/webui/$id/." "$stage/"
            cp -r art/webplayer/player "$stage/player"
            # ani-rss 认这个文件才能在线更新：它读 version 跟本仓库 Release 的 tag 比，
            # 不一样就下 filename 那个资产。一款一份，各自指向自己的包，
            # 否则更新一次就被换成另一款界面了。
            printf '{"owner":"%s","repo":"%s","version":"%s","filename":"%s"}\n' \
              "${{ github.repository_owner }}" "${GH_REPO#*/}" "$TAG" "ani-rss-webui-$id.zip" \
              > "$stage/webui.json"
            # 就这一份，放在包的根目录：在线更新读的是 config/webui/webui.json，
            # 上传时后端查的也是 ZipFile#getEntry("webui.json") —— 同一个位置，不用抄第二份。
            # （3.2.17 有过一版把它找去 config/webui/webui/ 的构建，上游 81f43b5 已经改回来了。）
            # 解压后必须直接就是 config/webui/index.html，不能多套一层目录
            test -f "$stage/index.html"           || { echo "::error::$id 包根目录没有 index.html"; exit 1; }
            test -f "$stage/player/play.html"     || { echo "::error::$id 包里没有 player/play.html"; exit 1; }
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/out/ani-rss-webui-$id.zip" .)
          done
          cd out && sha256sum *.zip > checksums.txt && ls -lh

      # ani-rss 关于页上那段「界面更新内容」读的就是这里的正文。
      # 原来这份正文从头到尾都是安装说明 —— 装了十次看到的是同一段话，
      # 「这一版改了什么」一个字都没有，等于那张卡白显示。
      - name: 生成发布说明
        run: |
          set -e
          # 上一版的 tag。tag 就是纯版本号，所以先滤掉历史上用过的其它命名，
          # 再按版本号排序取第一个不是本次的那个。
          prev=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -1)
          if [ -n "$prev" ]; then
            since="自 $prev 以来"
            log=$(git log --no-merges --pretty=format:'- %s' "$prev..HEAD")
          else
            since="最近的改动"
            log=$(git log --no-merges --pretty=format:'- %s' -20)
          fi
          # 同版本号重发（改了构建、没动版本号）时这一段会是空的，别留个空标题在那儿。
          # 写成 if 而不是 `[ -n "$log" ] && ...`：后者在 set -e 下要是落到最后一条语句，
          # 空 changelog 会让整步以非零退出，发布直接失败。
          if [ -n "$log" ]; then
            log=$(printf '## 更新内容（%s）\n\n%s\n' "$since" "$log")
          fi

          cat > notes.md <<EOF
          $log

          ## 怎么装

          **ani-rss 3.2.17 及以上**：不用解压。在自带界面的「设置 → 页面」里点「选择文件并上传」，
          或者在本界面的「设置 → 关于 → 更换界面」里传这个 zip，传完刷新就换好了。
          同一张卡上的「还原自带界面」可以随时退回 ani-rss 原来那套。

          手动装：九款挑一款，解压到 ani-rss **配置目录**下的 \`webui/\` 里（没有就新建一个），
          刷新页面即可（**3.2.15 以下要重启 ani-rss**，那之前的版本静态资源带缓存）。
          **每个包都自带在线播放器**，不用再单独下一个。

          \`\`\`
          config/
          └── webui/
              ├── index.html   ← 必须在这一层，不能多套一层目录
              ├── webui.json   ← 版本信息，ani-rss 靠它在线更新，别删
              ├── assets/
              └── player/
          \`\`\`

          装好以后新版本在 ani-rss 里就能直接更新，不用再下一遍压缩包。

          | 压缩包 | 长什么样 |
          |---|---|
          | \`ani-rss-webui-acg.zip\`          | 二次元：壁纸打底的海报墙，窄屏走底部导航 |
          | \`ani-rss-webui-liquid-glass.zip\` | 液态玻璃：悬浮玻璃胶囊导航 + 横躺大卡 |
          | \`ani-rss-webui-vue.zip\`          | Vue 文档：分组侧栏 + 居中正文 |
          | \`ani-rss-webui-github.zip\`       | GitHub：深色顶栏 + tab，一张带边框的清单 |
          | \`ani-rss-webui-material.zip\`     | Material Design 3：导航栏杆 / 底部导航 + FAB |
          | \`ani-rss-webui-win98.zip\`        | Windows 98：标题栏 + 菜单栏 + 任务栏，订阅页是详细信息列表 |
          | \`ani-rss-webui-argon.zip\`        | Argon：毛玻璃顶栏 + 居中正文栏 + 右侧挂件，一列会浮起来的大圆角卡 |
          | \`ani-rss-webui-macintosh.zip\`    | 经典 Macintosh：黑白两色，苹果菜单栏 + 条纹标题栏，Finder 图标视图 |
          | \`ani-rss-webui-synology.zip\`     | 群晖 DSM：顶部任务栏 + 主菜单，应用在一扇带左侧栏的窗里 |

          九款是同一套功能的不同外观，**装一款就够**，装第二款会覆盖第一款。
          想换回自带界面：清空（或删掉）\`webui/\` 目录再重启。

          ### 一行装好

          Linux / macOS / NAS：
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`

          Windows PowerShell：
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
          \`\`\`

          脚本会问你配置目录在哪、装哪一款，然后自己下载解压 —— 装完还是要重启一次。

          ### 先在线看看

          <https://zzzwannasleep.github.io/ani-rss-themes/webui/> —— 九款都能点开试，数据是内置的假数据。

          ---
          构建自 \`${GITHUB_SHA:0:7}\`，webplayer 构建自 \`zzzwannasleep/webplayer@${{ needs.player.outputs.sha }}\`
          EOF

      # 版本号取 webui/package.json：没动版本号就把同一个 Release 原地换成最新一次构建，
      # 动了版本号就自然多一个 Release，历史还在。
      # 先删再建而不是 --clobber 覆盖：万一以后少打一款，光覆盖会把上一版的残留资产留在那儿。
      - name: 发布
        run: |
          set -e
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          # 兜底：上一次跑到一半被砍，可能留下一个没有 Release 的孤儿标签。
          # 不清掉的话 create 会挂在那个旧提交上，--target 会被忽略，发出去的是上一版的代码。
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" --silent 2>/dev/null || true
          gh release create "$TAG" out/*.zip out/checksums.txt \
            --title "WebUI $TAG" --notes-file notes.md --latest --target "$GITHUB_SHA"
          echo "已发布 $TAG："
          gh release view "$TAG" --json assets --jq '.assets[].name'
